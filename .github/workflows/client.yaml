name: khairul ummah Client  CI/CD Pipeline
on:
  push:
    branches:
      - main
      - advance-ui
  pull_request:
    branches:
      - main
      - advance-ui
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
    #   - name: 🔨 Create .env file
    #     env:
    #       PROD_ENV: ${{ secrets.CLIENT_ENV }}
    #     run: |
    #       echo "$PROD_ENV" > server/.env
      # Step 3: Install dependencies for both frontend and backend
      - name: Install dependencies and build
        run: |
          npm i -g pnpm
          cd client
          test -f src/config/site.ts || (echo "Missing src/config/site.ts — commit site config before deploy" && exit 1)
          CI=true pnpm i && pnpm build

      - name: Copy files to server
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          overwrite: true
          source: client/.next,client/public,client/.gitignore,client/components.json,client/eslint.config.mjs,client/next.config.mjs,client/package.json,client/pnpm-lock.yaml,client/pnpm-workspace.yaml,client/pm2.config.js,client/postcss.config.mjs,client/tailwind.config.ts,client/tsconfig.json,client/README.md
          target: "/var/www/khairulummah"


      - name: Run scripts on server
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}
          script: |
            cd /var/www/khairulummah/client
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"
            export PATH="$PATH:$HOME/.nvm/versions/node/v22.15.0/bin"
            CI=true pnpm i
            pm2 reload pm2.config.js